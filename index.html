<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Челл-ТД</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--card2:#232949;--text:#eef0ff;--dim:#8c92b8;--acc:#7c8cff;--ok:#4cd98a;--bad:#ff5d6c;--warn:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
section{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
[hidden]{display:none!important}
h1{font-size:18px;margin:12px 4px 2px}
.sub{color:var(--dim);font-size:13px;margin:0 4px 8px}
#list{flex:1;overflow-y:auto;padding:2px 0 8px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px;margin:6px 0;cursor:pointer}
.card.sel{border-color:var(--acc);background:var(--card2)}
.card .em{font-size:26px;width:38px;height:38px;line-height:38px;text-align:center;flex:none}
.card .nm{font-weight:600;font-size:15px}
.card .st{color:var(--dim);font-size:12px;margin-top:2px}
.card .ck{margin-left:auto;font-size:20px}
button{font:inherit;color:var(--text);border:0;border-radius:12px;padding:12px 14px;background:var(--card2)}
button:active{transform:scale(.97)}
.big{background:linear-gradient(135deg,#6c7bff,#9b6cff);font-weight:700;font-size:16px;width:100%;padding:14px}
.big:disabled{opacity:.4}
.bar{display:flex;gap:8px;align-items:center;padding:8px 2px}
.chip{background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
#cv-wrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;max-height:100%;touch-action:manipulation;border-radius:14px;background:#141830}
#boss{display:none;margin:2px 0 4px}
#boss .bb{height:12px;background:#2a2f52;border-radius:6px;overflow:hidden}
#boss .bb>div{height:100%;background:linear-gradient(90deg,#ff5d6c,#ff9a5d);width:100%}
#boss .bt{font-size:12px;color:var(--dim);margin-bottom:2px}
#prev{font-size:13px;color:var(--dim);text-align:center;padding:4px 0}
#squad{display:flex;gap:6px;padding:4px 0}
.sq{flex:1;min-width:0;background:var(--card);border:2px solid transparent;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;line-height:1.25}
.sq .em{font-size:20px;width:30px;height:30px;line-height:30px;margin:0 auto}
.sq.hold{border-color:var(--warn);background:var(--card2)}
.sq.on{border-color:var(--ok)}
.sq .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
#info{font-size:12px;color:var(--dim);min-height:34px;padding:2px 4px}
#info b{color:var(--text)}
.row{display:flex;gap:8px}
.row>*{flex:1}
#over{position:absolute;inset:0;background:rgba(10,12,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#over h2{margin:0;font-size:26px}
#over p{margin:0;color:var(--dim)}
.seg{display:flex;gap:6px;margin:4px 0}.seg button{flex:1;padding:8px 2px;font-size:13px}.seg .on{background:var(--acc);font-weight:700}#opt-m{flex-wrap:wrap}#opt-m button{flex:1 1 30%}
.mb{display:block;width:100%;padding:18px;font-size:18px;margin:8px 0;font-weight:700}.lbl{font-size:13px;color:var(--dim);margin:8px 4px 0}
.bar .chip{padding:6px 7px;font-size:13px}.bar{gap:5px}.chip.on{background:var(--acc);color:#0b0e1c}
#upg{position:absolute;left:50%;transform:translateX(-50%);width:min(300px,92%);background:linear-gradient(160deg,rgba(38,45,80,.97),rgba(18,22,44,.97));border:1.5px solid var(--rc,#7c8cff);border-radius:18px;padding:12px;color:var(--text);z-index:5;box-shadow:0 10px 30px #000c,0 0 20px color-mix(in srgb,var(--rc,#7c8cff) 38%,transparent);backdrop-filter:blur(8px)}
#upg{touch-action:none;cursor:grab}#upg.drag{cursor:grabbing;opacity:.82}#upg:before{content:"";display:block;width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.28);margin:-4px auto 8px}
#upg .u-h{display:flex;align-items:center;gap:10px}#upg .u-h b{flex:1;font-size:16px;font-weight:800;letter-spacing:.2px}
#upg .u-em{width:42px;height:42px;line-height:42px;text-align:center;font-size:24px;background:rgba(255,255,255,.07);border:1.5px solid var(--rc,#7c8cff);border-radius:13px;overflow:hidden}
#upg .u-x{width:30px;height:30px;padding:0;background:rgba(255,255,255,.1);border:0;color:var(--dim);border-radius:50%;font-size:14px}
#upg .u-lv{margin:10px 0 2px;display:flex;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--dim)}
#upg .u-dots{display:flex;justify-content:center;gap:6px;margin:4px 0 8px}
#upg .u-dots i{width:22px;height:5px;border-radius:3px;background:rgba(255,255,255,.14)}#upg .u-dots i.on{background:var(--rc,#7c8cff);box-shadow:0 0 8px var(--rc,#7c8cff)}
#upg .u-r{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border-radius:11px;padding:7px 11px;margin:4px 0;font-size:14px}
#upg .u-r span{flex:1;color:var(--dim);font-weight:600}#upg .u-r b{font-size:15px;color:#fff}#upg .u-r i{font-style:normal;color:var(--ok);font-weight:700;min-width:46px;text-align:right}
#upg .u-r button{background:rgba(124,140,255,.18);color:#c9d0ff;border:1px solid rgba(124,140,255,.45);border-radius:9px;padding:5px 14px;font-weight:700}
#upg .u-r i.red{color:#ff8a95}#upg .u-note{margin:6px 0 2px;font-size:12px;text-align:center;color:var(--warn)}
#upg .u-up{display:block;width:100%;margin-top:10px;padding:11px;font-size:16px;font-weight:800;background:linear-gradient(135deg,#38d884,#1fa862);color:#06210f;border:0;border-radius:13px;box-shadow:0 4px 14px rgba(40,200,120,.35)}
#upg .u-up.off{background:rgba(255,255,255,.1);color:var(--dim);box-shadow:none}
#upg .u-sell{display:block;width:100%;margin-top:7px;padding:9px;font-size:14px;font-weight:700;background:transparent;color:#ff8591;border:1.5px solid rgba(255,93,108,.6);border-radius:13px}

/* ── выбор режима и карты ── */
#s-play{padding-left:12px;padding-right:12px}
#s-play .scroll{flex:1;min-height:0;overflow-y:auto;padding:0 0 8px;margin:0 -4px;padding:0 4px}
.ph{display:flex;align-items:center;gap:10px;margin:10px 0 4px}
.ph h1{margin:0;font-size:20px}
.ph .bk{width:38px;height:38px;padding:0;border-radius:50%;background:var(--card);font-size:18px}
.sec{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:12px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--dim)}
.sec:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(140,146,184,.35),transparent)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mode{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:12px 4px 10px;background:var(--card);border:2px solid transparent;border-radius:16px;text-align:center;transition:transform .12s,border-color .15s,background .15s}
.mode .mi{font-size:28px;line-height:1}
.mode .mn{font-weight:800;font-size:13px}
.mode .mr{font-size:11px;color:var(--dim);line-height:1.35}
.mode .md{margin-top:4px;padding:3px 8px;border-radius:999px;background:rgba(124,140,255,.15);color:#c9d0ff;font-size:12px;font-weight:800}
.mode.wide{grid-column:1/-1;flex-direction:row;justify-content:center;gap:14px;padding:12px 14px;text-align:left}.mode.wide .md{margin:0}
.mode.on{border-color:var(--c);background:linear-gradient(170deg,color-mix(in srgb,var(--c) 22%,var(--card2)),var(--card));box-shadow:0 6px 18px color-mix(in srgb,var(--c) 30%,transparent);transform:translateY(-2px)}
.mode.on .md{background:var(--c);color:#0b0e1c}
.mode.on:after{content:"✓";position:absolute;top:6px;right:8px;font-size:12px;font-weight:900;color:var(--c)}
.maps{display:flex;flex-direction:column;gap:8px}
.map{display:flex;gap:12px;align-items:center;text-align:left;padding:8px;background:var(--card);border:2px solid transparent;border-radius:16px;width:100%;transition:border-color .15s,background .15s}
.map canvas.pv{width:132px;height:94px;max-height:none;flex:none;border-radius:11px;background:#141830;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.map .mt{flex:1;min-width:0}
.map .mn{font-weight:800;font-size:15px}
.map .md{font-size:12px;color:var(--dim);margin:2px 0 6px;line-height:1.3}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:999px;background:rgba(255,255,255,.08);color:var(--text)}
.tag.warn{background:rgba(255,200,87,.16);color:var(--warn)}
.tag.ok{background:rgba(76,217,138,.15);color:var(--ok)}
.map.on{border-color:var(--acc);background:linear-gradient(170deg,var(--card2),var(--card));box-shadow:0 6px 18px rgba(124,140,255,.25)}
.sumbar{display:flex;align-items:center;gap:8px;margin:8px 0 6px;padding:9px 12px;background:var(--card);border-radius:12px;font-size:12.5px;color:var(--dim)}
.sumbar b{color:var(--text)}
.sumbar .sq-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sumbar.warn{background:rgba(255,200,87,.12);color:var(--warn)}
</style>
</head>
<body>
<section id="s-menu">
  <div style="margin:auto 0">
    <h1 style="font-size:30px;text-align:center">🛡 Челл-ТД</h1>
    <p class="sub" style="text-align:center;margin-bottom:24px">Защити базу от волн монстров</p>
    <button class="big mb" id="m-play">▶ Играть</button>
    <button class="mb" id="m-chel"></button>
  </div>
</section>

<section id="s-play" hidden>
  <div class="ph"><button class="bk" id="p-back">←</button><h1>Новая игра</h1></div>
  <div class="scroll">
    <div class="sec">Режим</div>
    <div class="modes" id="opt-d"></div>
    <div class="sec">Карта</div>
    <div class="maps" id="opt-m"></div>
  </div>
  <div class="sumbar" id="sumbar"><span class="sq-t" id="play-squad"></span><span id="map-info" hidden></span></div>
  <button class="big" id="start" style="margin-bottom:8px">⚔️ В бой</button>
</section>

<section id="s-pick" hidden>
  <h1>🛡 Челл-ТД</h1>
  <p class="sub" id="pick-sub">Выберите до 5 человечинок. Урон и редкость взяты из дуэлей.</p>
  <div id="list"></div>
  <button class="big" id="go">✔ Готово</button>
</section>

<section id="s-game" hidden>
  <div class="bar">
    <span class="chip" id="h-lives">❤️ 10</span>
    <span class="chip" id="h-wave">🌊 1/8</span>
    <span class="chip" id="h-money">💰 0</span>
    <span class="chip" id="h-gems" hidden>💎 0</span>
    <span class="chip" id="h-time">⏱ 0:00</span>
    <span style="flex:1"></span>
    <button class="chip" id="b-snd">🔊</button>
    <audio id="custom-track" src="Bensley%20-%20Vex.mp3" loop preload="auto"></audio>
    <button class="chip" id="b-auto" title="Автоскип">⏩</button>
    <button class="chip" id="b-speed">×1</button>
  </div>
  <div id="boss"><div class="bt" id="boss-t">👹 БОСС</div><div class="bb"><div id="boss-f"></div></div></div>
  <div id="cv-wrap"><canvas id="cv"></canvas><div id="upg" hidden></div></div>
  <div id="prev"></div>
  <div id="info"></div>
  <div id="squad"></div>
  <div class="row" style="padding:6px 0 8px">
    <button class="big" id="b-place" hidden>📍 Поставить</button>
    <button class="big" id="b-skip" hidden>⏭ Скип волны</button>
    <button class="big" id="b-wave">▶ Волна 1</button>
    <button id="b-ff" style="flex:0 0 auto">🏳️</button>
  </div>
  <div id="over" hidden>
    <h2 id="o-t"></h2><p id="o-s"></p>
    <p id="o-r" style="font-weight:800;font-size:18px;color:#6cf0ff;margin:4px 0"></p>
    <button class="big" id="o-retry" hidden style="max-width:320px;margin-bottom:8px">💎 Повторить зачисление</button>
    <button class="big" id="o-again" style="max-width:320px">🔁 Играть снова</button>
  </div>
</section>

<script>
"use strict";
// ==ENGINE START==
let PATH_LEN = 12;
const DIFFS = [{name:"😊 Лёгкий",hp:0.6,lives:15,cash:300,gold:1.3,waves:20,diamonds:5},{name:"😐 Нормальный",hp:0.85,lives:12,cash:450,gold:1.05,waves:35,diamonds:25,mini:30,stun:true,stunner:true},{name:"😈 Сложный",hp:1.25,lives:8,cash:300,gold:0.95,waves:40,diamonds:40,mini:30,stun:true,stunner:true},{name:"♾ Бесконечный",hp:1,lives:12,cash:450,gold:1,waves:40,diamonds:0,stun:true,endless:true}];
const MAX_SQUAD = 5;
let WAVES = 8, WSCALE = 8; // WAVES = Infinity в бесконечном режиме, WSCALE — по какой шкале растёт сложность
const maxUnits = () => G && G.diff.endless ? ENDLESS_UNITS : MAX_UNITS;
const GEM_PER_WAVE = 0.5; // 💎 за каждую волну начиная с 20-й
const endlessGems = g => g.diff.endless ? Math.max(0, g.wave - ENDLESS_GEM_WAVE + 1) * GEM_PER_WAVE : 0;
const endlessPay = g => Math.floor(endlessGems(g)); // начисляются целые алмазы
const isMini = (g, w) => g.diff.endless ? (w >= 10 && w % 10 === 0) : g.diff.mini === w;
const wavesLbl = () => isFinite(WAVES) ? "/" + WAVES : "";
const MUSIC_VOL = 0.35; // музыка на 30% тише (было 0.5)
let sfxBoost = 1;
const BASE_LIVES = 10;
const RANGE = {common:2, rare:2, epic:3, legendary:3, mythic:3, secret:4, special:3, godly:4, imbaogaggg:2};
const WAVE_F = [1.32, 1.8, 2.28, 2.82, 3.36, 3.96, 4.56];
const waveF = w => { const x = Math.min(1, (w - 1) / Math.max(1, WSCALE - 2)), p = x * (WAVE_F.length - 1), i = Math.floor(p), f = p - i; return (WAVE_F[i] + (WAVE_F[Math.min(i + 1, WAVE_F.length - 1)] - WAVE_F[i]) * f) * (1 + (WSCALE - 8) * 0.06 * x) * (0.6 + 0.4 * Math.min(1, x * 4)) * (1 + 3 * x * x) * Math.pow(1.07, Math.max(0, w - WSCALE)); };
// ── стан от босса: время в секундах переводится в ходы (1 ход = 0.75с на ×1) ──
const STUN_RANGE = 60;                       // босс «подходит ближе» к человечинке на это расстояние
const stunTicks = s => Math.ceil(s / 0.75);
const STUN_MINI = stunTicks(5), STUN_BOSS = stunTicks(2), STUN_CD = stunTicks(10);
const STUN_FAST = stunTicks(2), STUN_FAST_CD = stunTicks(15); // быстрый оглушитель: стан 2с, кд 15с
const BOSS_F = 1.6, BOSS_ARMOR = 0.15, BOSS_REGEN = 0.01, IMBA_POWER = 5.0;
const SIZE_MULT = {1:0.9, 2:0.95, 3:1, 4:1, 5:1};
const ENEMY_EMOJI = {stunner:"👾", mini:"👾", normal:"👾", fast:"👾", tank:"👾", swarm:"👾", dasher:"👾", brute:"👾", boss:"👾"};
// все враги — 👾, но у каждого типа свой цвет кольца, размер и оттенок
const LOOK = {
  stunner:{s:20, c:"#c08a5e", h:115}, normal:{s:22, c:"#a78bfa", h:0}, fast:{s:19, c:"#3ddc84", h:235}, tank:{s:26, c:"#5aa0ff", h:305, th:1},
  swarm:{s:15, c:"#ff9a3d", h:120}, dasher:{s:19, c:"#ffd23f", h:135}, brute:{s:30, c:"#ff4d4d", h:90, th:1}, boss:{s:40, c:"#ffb300", h:130, th:1}, mini:{s:34, c:"#ff7a00", h:60, th:1}
};
const DOT = {stunner:"🟤", normal:"🟣", fast:"🟢", tank:"🔵", swarm:"🟠", dasher:"🟡", brute:"🔴", boss:"👑", mini:"👹"};
const KIND_NAME = {stunner:"оглуш.", normal:"обыч.", fast:"быстр.", tank:"танк", swarm:"рой", dasher:"рывок", brute:"громила"};
const MUT_NOTES = {
  "Сгоревшая":"🔥 +5% макс. HP цели к удару", "Заражен":"🧟 30%: +8% макс. HP цели",
  "Крут":"😎 20%: крит ×1.5", "Богат":"🤑 урон +10%", "Заморожен":"🥶 25%: враг стоит ход",
  "Админ":"👨‍💻 урон +20%", "Хакер":"💻 каждые 25 ударов +1 жизнь базе"
};
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const towerRange = t => RANGE[t.rarity] || 2;
const TICK_SEC = 0.75; // длительность одного хода на скорости ×1
const CD_SEC = {common:1.0, rare:0.9, epic:0.85, legendary:0.75, mythic:0.65, secret:0.6, special:0.7, godly:0.5, imbaogaggg:0.75};
// перезарядка по уровням: снижается не на каждом улучшении, а только на некоторых
const CD_TABLE = {secret:[2, 2, 1.5, 1.5, 1], godly:[2.5, 2.5, 2, 2, 1], mythic:[1.5, 1.5, 1.2, 1.2, 0.8]};
const CD_STEPS = [1, 0.9, 0.9, 0.8, 0.8]; // остальные редкости: падает на ур. 2 и 4
const towerCd = (t, l) => { const L = Math.min(5, Math.max(1, l || 1)), tb = CD_TABLE[t.rarity]; return tb ? tb[L - 1] : (CD_SEC[t.rarity] || 0.8) * CD_STEPS[L - 1]; };
const AOE_LVL = {secret:2, godly:3}, AOE_F = 0.6;
// AoE-конус: основной удар (по цели) идёт по всему радиусу атаки, а площадь — это сектор внутри
// меньшего круга вокруг башни, повёрнутый в сторону цели. f — доля радиуса атаки, a — полуугол (рад)
const AOE_CONE = {secret:{f:0.35, a:0.8}, godly:{f:0.4, a:1.05}};
const aoeR = (t, l) => towerR(t, l) * AOE_CONE[t.rarity].f; // у площади свой, небольшой радиус
const fmtHp = n => n >= 1e6 ? (n / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : n >= 1e3 ? (n / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(Math.max(0, Math.ceil(n)));
const rShow = r => (r / 10).toFixed(1).replace(/\.0$/, ""); // радиус для показа (в десятках), на геймплей не влияет
const towerR = (t, l) => 40 + towerRange(t) * 38 + ((l || 1) - 1) * 8; // радиус атаки в пикселях
const HP_K = 0.32, BOSS_MULT = 25;
const ENDLESS_GEM_WAVE = 20, ENDLESS_UNITS = 25; // бесконечный режим: 💎 копятся с 20-й волны (+1 за волну), лимит юнитов 25
const MAX_LVL = 5, MAX_UNITS = 15, ENEMY_BUFF = 1.4, ARMOR = {mini:0.1, boss:0.15, brute:0.2, tank:0.1, dasher:0.05};
const COST = {common:40, rare:70, epic:120, legendary:200, mythic:300, secret:420, special:330, godly:800, imbaogaggg:380};
const towerCost = t => COST[t.rarity] || 100;
const upCost = (t, l) => Math.round(towerCost(t) * 0.6 * l);
const REWARD = {stunner:12, mini:80, normal:8, fast:8, swarm:4, dasher:10, tank:18, brute:35, boss:200};
let breakLeft = null;
let SEQ = [], CELLS = [];
function towerPower(t) {
  const avg = t.rarity === "imbaogaggg" ? IMBA_POWER : (t.dmgMin + t.dmgMax) / 2;
  return avg * (2 * towerRange(t) + 1) * 0.8;
}
// «средний удар» отряда (среднее геометрическое, без имбы) — от него считается HP врагов,

  c.fillText("🚪", Math.max(8, e[0] * k + 8), e[1] * ky);
  c.fillText("🏰", b[0] * k, b[1] * ky);
}
function renderPlay() {
  const dEl = $("opt-d"), mEl = $("opt-m"), keepY = document.querySelector("#s-play .scroll").scrollTop;
  dEl.innerHTML = ""; mEl.innerHTML = "";
  DIFFS.forEach((d, i) => {
    const ui = DIFF_UI[i] || DIFF_UI[1], parts = d.name.split(" "), b = document.createElement("button");
    b.className = "mode" + (i === diffI ? " on" : ""); b.style.setProperty("--c", ui.c);
    if (d.endless) {
      b.classList.add("wide");
      b.innerHTML = '<span class="mi">' + parts[0] + '</span><span><span class="mn">' + parts.slice(1).join(" ") + '</span><br><span class="mr">💎 копятся с ' + ENDLESS_GEM_WAVE + '-й волны · ' + ENDLESS_UNITS + ' юнитов<br>Мини-босс каждые 10 волн · ❤️ ' + d.lives + '</span></span>' +
        '<span class="md" style="white-space:nowrap">🏆 ' + (getBest(mapI) || "—") + '</span>';
    } else b.innerHTML = '<span class="mi">' + parts[0] + '</span><span class="mn">' + parts.slice(1).join(" ") + '</span>' +
      '<span class="mr">❤️ ' + d.lives + ' · 💰 ' + d.cash + '<br>🌊 ' + d.waves + ' волн</span>' +
      '<span class="md">💎 +' + d.diamonds + '</span>';
    b.onclick = () => { diffI = i; haptic(); renderPlay(); };
    dEl.appendChild(b);
  });
  MAPS.forEach((m, i) => {
    const b = document.createElement("button"), parts = m.name.split(" ");
    b.className = "map" + (i === mapI ? " on" : "");
    const cv = document.createElement("canvas"); cv.className = "pv";
    const t = document.createElement("div"); t.className = "mt";
    const len = m.cells.length;
    t.innerHTML = '<div class="mn">' + parts[0] + ' ' + parts.slice(1).join(" ") + '</div><div class="md">' + (MAP_UI[i] ? MAP_UI[i].d : "") + '</div>' +
      '<div class="tags"><span class="tag">📏 ' + len + ' клеток</span>' + (m.dodge ? '<span class="tag warn">💨 уклонение ' + Math.round(m.dodge * 100) + '%</span>' : '<span class="tag ok">без уклонения</span>') + '</div>';
    b.appendChild(cv); b.appendChild(t);
    b.onclick = () => { mapI = i; haptic(); renderPlay(); };
    mEl.appendChild(b); drawPreview(cv, m);
  });
  document.querySelector("#s-play .scroll").scrollTop = keepY;
  const sb = $("sumbar"); sb.classList.toggle("warn", !picked.length);
  $("play-squad").innerHTML = picked.length ? "🧍 Отряд (" + picked.length + "/" + MAX_SQUAD + "): <b>" + picked.map(i => cands[i].name).join(", ") + "</b>" : "⚠️ Сначала выберите человечинок.";
  $("start").textContent = picked.length ? "⚔️ В бой" : "🧍 Выбрать человечинок";
}
$("m-play").onclick = () => { haptic(); show("s-play"); };
$("m-chel").onclick = () => { haptic(); show("s-pick"); };
$("p-back").onclick = () => { haptic(); show("s-menu"); };
$("start").onclick = () => { haptic("medium"); if (picked.length) startGame(); else show("s-pick"); };
show("s-menu");
requestAnimationFrame(frame);
window.__ttd = {step, newGame, startWave, buildQueue, towerPower, squadPower, get G() { return G; }};
</script>
