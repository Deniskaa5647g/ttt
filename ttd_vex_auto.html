<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Челл-ТД</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0f1220;--card:#1a1f36;--card2:#232949;--text:#eef0ff;--dim:#8c92b8;--acc:#7c8cff;--ok:#4cd98a;--bad:#ff5d6c;--warn:#ffc857}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden}
section{position:absolute;inset:0;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
[hidden]{display:none!important}
h1{font-size:18px;margin:12px 4px 2px}
.sub{color:var(--dim);font-size:13px;margin:0 4px 8px}
#list{flex:1;overflow-y:auto;padding:2px 0 8px}
.card{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px;margin:6px 0;cursor:pointer}
.card.sel{border-color:var(--acc);background:var(--card2)}
.card .em{font-size:26px;width:38px;height:38px;line-height:38px;text-align:center;flex:none}
.card .nm{font-weight:600;font-size:15px}
.card .st{color:var(--dim);font-size:12px;margin-top:2px}
.card .ck{margin-left:auto;font-size:20px}
button{font:inherit;color:var(--text);border:0;border-radius:12px;padding:12px 14px;background:var(--card2)}
button:active{transform:scale(.97)}
.big{background:linear-gradient(135deg,#6c7bff,#9b6cff);font-weight:700;font-size:16px;width:100%;padding:14px}
.big:disabled{opacity:.4}
.bar{display:flex;gap:8px;align-items:center;padding:8px 2px}
.chip{background:var(--card);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:600;white-space:nowrap}
#cv-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
canvas{width:100%;max-height:100%;touch-action:manipulation;border-radius:14px;background:#141830}
#boss{display:none;margin:2px 0 4px}
#boss .bb{height:12px;background:#2a2f52;border-radius:6px;overflow:hidden}
#boss .bb>div{height:100%;background:linear-gradient(90deg,#ff5d6c,#ff9a5d);width:100%}
#boss .bt{font-size:12px;color:var(--dim);margin-bottom:2px}
#prev{font-size:13px;color:var(--dim);text-align:center;padding:4px 0}
#squad{display:flex;gap:6px;padding:4px 0}
.sq{flex:1;min-width:0;background:var(--card);border:2px solid transparent;border-radius:10px;padding:6px 2px;text-align:center;font-size:11px;line-height:1.25}
.sq .em{font-size:20px;width:30px;height:30px;line-height:30px;margin:0 auto}
.sq.hold{border-color:var(--warn);background:var(--card2)}
.sq.on{border-color:var(--ok)}
.sq .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 2px}
#info{font-size:12px;color:var(--dim);min-height:34px;padding:2px 4px}
#info b{color:var(--text)}
.row{display:flex;gap:8px}
.row>*{flex:1}
#over{position:absolute;inset:0;background:rgba(10,12,24,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px}
#over h2{margin:0;font-size:26px}
#over p{margin:0;color:var(--dim)}
.seg{display:flex;gap:6px;margin:4px 0}.seg button{flex:1;padding:8px 2px;font-size:13px}.seg .on{background:var(--acc);font-weight:700}
.mb{display:block;width:100%;padding:18px;font-size:18px;margin:8px 0;font-weight:700}.lbl{font-size:13px;color:var(--dim);margin:8px 4px 0}
.bar .chip{padding:6px 7px;font-size:13px}
</style>
</head>
<body>
<section id="s-menu">
  <div style="margin:auto 0">
    <h1 style="font-size:30px;text-align:center">🛡 Челл-ТД</h1>
    <p class="sub" style="text-align:center;margin-bottom:24px">Защити базу от волн монстров</p>
    <button class="big mb" id="m-play">▶ Играть</button>
    <button class="mb" id="m-chel"></button>
  </div>
</section>

<section id="s-play" hidden>
  <h1>▶ Играть</h1>
  <div class="lbl">Сложность</div><div class="seg" id="opt-d"></div>
  <div class="lbl">Карта</div><div class="seg" id="opt-m"></div>
  <p class="sub" id="map-info" style="margin-top:6px"></p>
  <p class="sub" id="play-squad"></p>
  <div style="flex:1"></div>
  <button class="big" id="start">⚔️ В бой</button>
  <button id="p-back" style="margin:8px 0">← Назад</button>
</section>

<section id="s-pick" hidden>
  <h1>🛡 Челл-ТД</h1>
  <p class="sub" id="pick-sub">Выберите до 5 человечинок. Урон и редкость взяты из дуэлей.</p>
  <div id="list"></div>
  <button class="big" id="go">✔ Готово</button>
</section>

<section id="s-game" hidden>
  <div class="bar">
    <span class="chip" id="h-lives">❤️ 10</span>
    <span class="chip" id="h-wave">🌊 1/8</span>
    <span class="chip" id="h-kills">☠️ 0</span>
    <span class="chip" id="h-money">💰 0</span>
    <span style="flex:1"></span>
    <button class="chip" id="b-snd">🔊</button>
    <audio id="custom-track" src="Bensley%20-%20Vex.mp3" loop preload="auto"></audio>
    <button class="chip" id="b-speed">×1</button>
    <button class="chip" id="b-pause">⏸</button>
  </div>
  <div id="boss"><div class="bt" id="boss-t">👹 БОСС</div><div class="bb"><div id="boss-f"></div></div></div>
  <div id="cv-wrap"><canvas id="cv"></canvas></div>
  <div id="prev"></div>
  <div id="info"></div>
  <div id="squad"></div>
  <div class="row" style="padding:6px 0 8px">
    <button class="big" id="b-place" hidden>📍 Поставить</button>
    <button class="big" id="b-skip" hidden>⏭ Скип волны</button>
    <button class="big" id="b-wave">▶ Волна 1</button>
    <button id="b-ff" style="flex:0 0 auto">🏳️</button>
  </div>
  <div id="over" hidden>
    <h2 id="o-t"></h2><p id="o-s"></p>
    <button class="big" id="o-again" style="max-width:320px">🔁 Играть снова</button>
  </div>
</section>

<script>
"use strict";
// ==ENGINE START==
let PATH_LEN = 12;
const DIFFS = [{name:"😊 Лёгкий",hp:0.6,lives:15,cash:800,gold:1.3},{name:"😐 Нормальный",hp:1,lives:10,cash:600,gold:1},{name:"😈 Сложный",hp:1.5,lives:6,cash:450,gold:0.85}];
const MAX_SQUAD = 5;
const WAVES = 8;
const BASE_LIVES = 10;
const RANGE = {common:2, rare:2, epic:3, legendary:3, mythic:3, secret:4, special:3, godly:4, imbaogaggg:2};
const WAVE_F = [1.32, 1.8, 2.28, 2.82, 3.36, 3.96, 4.56];
const BOSS_F = 1.6, BOSS_ARMOR = 0.15, BOSS_REGEN = 0.01, IMBA_POWER = 5.0;
const SIZE_MULT = {1:0.9, 2:0.95, 3:1, 4:1, 5:1};
const ENEMY_EMOJI = {normal:"👾", fast:"🏃", tank:"🛡", swarm:"🐜", dasher:"🐺", brute:"🦍", boss:"👹"};
const MUT_NOTES = {
  "Сгоревшая":"🔥 +5% макс. HP цели к удару", "Заражен":"🧟 30%: +8% макс. HP цели",
  "Крут":"😎 20%: крит ×1.5", "Богат":"🤑 урон +10%", "Заморожен":"🥶 25%: враг стоит ход",
  "Админ":"👨‍💻 урон +20%", "Хакер":"💻 каждые 25 ударов +1 жизнь базе"
};
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const towerRange = t => RANGE[t.rarity] || 2;
const towerR = (t, l) => 40 + towerRange(t) * 38 + ((l || 1) - 1) * 8; // радиус атаки в пикселях
const MAX_LVL = 5, MAX_UNITS = 15, ENEMY_BUFF = 1.4, ARMOR = {boss:0.15, brute:0.2, tank:0.1, dasher:0.05};
const COST = {common:40, rare:70, epic:120, legendary:200, mythic:300, secret:420, special:330, godly:800, imbaogaggg:380};
const towerCost = t => COST[t.rarity] || 100;
const upCost = (t, l) => Math.round(towerCost(t) * 0.6 * l);
const REWARD = {normal:8, fast:8, swarm:4, dasher:10, tank:18, brute:35, boss:200};
let breakLeft = null;
let SEQ = [], CELLS = [];
function towerPower(t) {
  const avg = t.rarity === "imbaogaggg" ? IMBA_POWER : (t.dmgMin + t.dmgMax) / 2;
  return avg * (2 * towerRange(t) + 1) * 0.8;
}
function squadPower(ts) {
  if (!ts.length) return 1;
  const m = ts.map(t => Math.sqrt(towerPower(t))).reduce((a, b) => a + b, 0) / ts.length;
  return ts.length * m * m * (SIZE_MULT[ts.length] || 1);
}
function newGame(towers, diff, map) {
  const ts = towers.map(t => Object.assign({}, t, {hits: 0}));
  return {towers: ts, placed: {}, wave: 0, nid: 1, money: diff.cash, gold: diff.gold, invest: {}, lives: diff.lives, maxLives: diff.lives, hpMul: diff.hp, map, enemies: [], queue: [], kills: 0,
          tick: 0, log: "", over: null, power: squadPower(ts), fx: []};
}
function mkEnemy(kind, hp) {
  const speed = {normal:1, fast:2, tank:0.5, swarm:1, dasher:3, brute:0.5, boss:0.5}[kind];
  const cost = {normal:1, fast:1, tank:2, swarm:1, dasher:1, brute:3, boss:99}[kind];
  hp = Math.max(1, Math.round(hp));
  return {kind, hp, maxHp: hp, speed, pos: 0, prev: 0, cost, frozen: 0, armor: ARMOR[kind] || 0};
}
function buildQueue(g, wave) {
  const power = Math.max(1, g.power) * g.hpMul * ENEMY_BUFF;
  if (wave >= WAVES) {
    const out = [], esc = power * 0.35 / 4;
    for (let i = 0; i < 4; i++) out.push(mkEnemy("fast", esc));
    out.push(null, null, mkEnemy("boss", power * BOSS_F));
    return out;
  }
  const count = 7 + wave * 3, kinds = [];
  for (let i = 0; i < count; i++) {
    if (wave >= 6 && i % 7 === 6) kinds.push("brute");
    else if (wave >= 4 && i % 5 === 4) kinds.push("tank");
    else if (wave >= 5 && i % 6 === 2) kinds.push("dasher");
    else if (wave >= 3 && i % 4 === 3) kinds.push("fast");
    else if (wave >= 2 && i % 3 === 1) kinds.push("swarm");
    else kinds.push("normal");
  }
  const wm = {normal:1, fast:0.6, tank:3, swarm:0.4, dasher:0.5, brute:5};
  const total = kinds.reduce((a, k) => a + wm[k], 0);
  const unit = power * WAVE_F[Math.min(wave, WAVE_F.length) - 1] / total;
  return kinds.map(k => mkEnemy(k, unit * wm[k]));
}
function startWave(g) {
  g.wave += 1; g.queue = buildQueue(g, g.wave); g.waveTotal = g.queue.filter(Boolean).length;
  g.queue.forEach(e => { if (e && e.kind !== "boss") e.dodge = g.map.dodge || 0; }); g.enemies = []; g.tick = 0; g.log = ""; g.fx = [];
}
function hit(g, tower, target, mult) {
  let dmg = Math.floor(rnd(Math.floor(tower.dmgMin), Math.floor(tower.dmgMax)) * (mult || 1));
  const mut = tower.mutation; let note = "";
  if (tower.rarity === "imbaogaggg") {
    if (Math.random() < 0.15) {
      dmg = target.kind === "boss" ? Math.max(1, Math.floor(target.maxHp * 0.05)) : target.hp; note = "⚡";
    } else if (target.kind !== "boss") dmg = Math.max(dmg, Math.floor(target.maxHp * 0.08));
  }
  if (mut === "Крут" && Math.random() < 0.20) { dmg = Math.floor(dmg * 1.5); note = "💥"; }
  if (mut === "Админ") dmg = Math.floor(dmg * 1.2);
  if (mut === "Богат") dmg = Math.floor(dmg * 1.1);
  let extra = 0;
  if (mut === "Сгоревшая") extra = Math.min(Math.floor(dmg / 2), Math.floor(target.maxHp * 0.05));
  else if (mut === "Заражен" && Math.random() < 0.30) extra = Math.min(Math.floor(dmg / 2), Math.floor(target.maxHp * 0.08));
  let total = dmg + extra;
  if (target.armor) total = Math.floor(total * (1 - target.armor));
  total = Math.max(1, total);
  target.hp -= total;
  if (mut === "Заморожен" && target.kind !== "boss" && Math.random() < 0.25) target.frozen = 1;
  if (mut === "Хакер") {
    tower.hits += 1;
    if (tower.hits % 25 === 0 && g.lives < g.maxLives) { g.lives += 1; note = "💚"; }
  }
  return {note, dmg: total};
}
// Один ход. true — волна закончилась (или игра окончена).
function step(g) {
  g.tick += 1; g.fx = [];
  for (const e of g.enemies) e.prev = e.pos;
  for (const kS of Object.keys(g.placed)) {
    const pl = g.placed[kS], tower = g.towers[g.placed[kS].t], R = towerR(tower, pl.lvl);
    const zone = g.enemies.filter(e => { if (e.hp <= 0) return false; const q = xy(e.pos); return (q[0] - pl.x) ** 2 + (q[1] - pl.y) ** 2 <= R * R; });
    if (!zone.length) continue;
    const target = zone.reduce((a, b) => (b.pos > a.pos ? b : a));
    if (target.dodge && Math.random() < target.dodge) { g.fx.push({t: "shot", from: pl, enemy: target, note: "💨", color: tower.color}); continue; }
    const r = hit(g, tower, target, 1 + 0.4 * ((pl.lvl || 1) - 1));
    g.fx.push({t: "shot", from: pl, enemy: target, note: r.note, color: tower.color});
  }
  const dead = g.enemies.filter(e => e.hp <= 0);
  if (dead.length) {
    g.kills += dead.length;
    for (const e of dead) { g.fx.push({t: "die", pos: e.pos, kind: e.kind}); g.money += Math.round((REWARD[e.kind] || 5) * g.gold); }
    g.enemies = g.enemies.filter(e => e.hp > 0);
  }
  for (const e of g.enemies) if (e.kind === "boss") e.hp = Math.min(e.maxHp, e.hp + Math.floor(e.maxHp * BOSS_REGEN));
  let breached = 0; const alive = [];
  for (const e of g.enemies) {
    if (e.frozen > 0) e.frozen -= 1; else e.pos += e.speed;
    if (e.pos >= PATH_LEN) { g.lives -= e.cost; breached += 1; } else alive.push(e);
  }
  g.enemies = alive;
  if (g.queue.length) { const n = g.queue.shift(); if (n) g.enemies.push(n); }
  const parts = [];
  if (dead.length) parts.push("☠️ " + dead.length);
  if (breached) parts.push("💔 " + breached);
  g.log = parts.join("  ");
  if (g.lives <= 0) { g.lives = 0; g.over = "lose"; return true; }
  const fin = g.queue.length === 0 && g.enemies.length === 0;
  if (fin) g.money += Math.round((40 + g.wave * 10) * g.gold);
  return fin;
}
// ==ENGINE END==

// ─── данные игрока (из URL ?d=...) ───
const RARITY_KEYS = ["common","rare","epic","legendary","mythic","secret","special","godly","imbaogaggg"];
const MUT_KEYS = ["Сгоревшая","Заражен","Крут","Богат","Заморожен","Админ","Хакер"];
const R_EMOJI = {common:"⚪", rare:"🔵", epic:"🟣", legendary:"🟡", mythic:"🔴", secret:"🟤", special:"✨", godly:"💠", imbaogaggg:"⚡"};
const R_COLOR = {common:"#c8ccd8", rare:"#4aa3ff", epic:"#b86cff", legendary:"#ffc83d", mythic:"#ff5d6c", secret:"#a67c52", special:"#5de0e6", godly:"#6cf0ff", imbaogaggg:"#ffe14a"};

function decodeData() {
  try {
    const d = new URLSearchParams(location.search).get("d");
    if (!d) return null;
    let b = d.replace(/-/g, "+").replace(/_/g, "/");
    while (b.length % 4) b += "=";
    const bin = atob(b), bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const arr = JSON.parse(new TextDecoder("utf-8").decode(bytes));
    return arr.map(a => {
      const rarity = RARITY_KEYS[a[1]] || "common";
      return {img: a[5] != null ? +a[5] : null, name: String(a[0]), rarity, dmgMin: +a[2], dmgMax: +a[3], mutation: MUT_KEYS[a[4]] || null,
              emoji: R_EMOJI[rarity], color: R_COLOR[rarity]};
    }).filter(t => t.dmgMax > 0);
  } catch (e) { return null; }
}
function demoData() {
  const mk = (n, r, a, b, m) => ({img: null, name: n, rarity: r, dmgMin: a, dmgMax: b, mutation: m || null, emoji: R_EMOJI[r], color: R_COLOR[r]});
  return [mk("Демо-годли","godly",6000,9000), mk("Демо-секрет","secret",2500,4000,"Крут"), mk("Демо-мифик","mythic",1000,1700,"Сгоревшая"),
          mk("Демо-легенда","legendary",450,750), mk("Демо-эпик","epic",180,300,"Заморожен"), mk("Демо-редкий","rare",60,110),
          mk("Демо-обычный","common",12,22), mk("Демо-имба","imbaogaggg",1,3)];
}

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) {
  try { tg.ready(); tg.expand(); tg.setHeaderColor && tg.setHeaderColor("#0f1220"); tg.setBackgroundColor && tg.setBackgroundColor("#0f1220");
        tg.disableVerticalSwipes && tg.disableVerticalSwipes(); } catch (e) {}
}
const haptic = (k) => { try { tg && tg.HapticFeedback && tg.HapticFeedback.impactOccurred(k || "light"); } catch (e) {} };
const $ = id => document.getElementById(id);
const IMG_BASE = (new URLSearchParams(location.search).get("o") || location.origin).replace(/\/$/, "");
const IMGS = {};
const imgUrl = t => IMG_BASE + "/ttdimg?i=" + t.img;
function timg(t) {
  if (t.img == null) return null;
  let im = IMGS[t.img];
  if (!im) { im = IMGS[t.img] = new Image(); im.onerror = () => { im.bad = true; }; im.src = imgUrl(t); }
  return im.complete && im.naturalWidth && !im.bad ? im : null;
}
function setEm(el, t) {
  el.textContent = "";
  if (t.img == null) { el.textContent = t.emoji; return; }
  const i = document.createElement("img"); i.src = imgUrl(t); i.style.cssText = "width:100%;height:100%;object-fit:cover;border-radius:50%;display:block";
  i.onerror = () => { el.textContent = t.emoji; }; el.appendChild(i);
}

// ─── экран выбора ───
let cands = decodeData(), demo = false;
if (!cands || !cands.length) { cands = demoData(); demo = true; }
let picked = [];
function renderPick() {
  $("pick-sub").textContent = (demo ? "Демо-режим (данные игрока не переданы). " : "") +
    "Выберите до " + MAX_SQUAD + " человечинок (" + picked.length + "/" + MAX_SQUAD + "). Урон взят из дуэлей.";
  const list = $("list"); list.innerHTML = "";
  cands.forEach((t, i) => {
    const d = document.createElement("div");
    d.className = "card" + (picked.includes(i) ? " sel" : "");
    const note = t.mutation && MUT_NOTES[t.mutation] ? " · " + MUT_NOTES[t.mutation] : (t.rarity === "imbaogaggg" ? " · ⚡ 15%: мгновенное убийство" : "");
    d.innerHTML = '<div class="em"></div><div><div class="nm"></div><div class="st"></div></div><div class="ck"></div>';
    setEm(d.querySelector(".em"), t);
    d.querySelector(".nm").textContent = t.name;
    d.querySelector(".st").textContent = "⚔ " + t.dmgMin + "–" + t.dmgMax + " · 🎯 " + towerRange(t) + " · 💰" + towerCost(t) + note;
    d.querySelector(".ck").textContent = picked.includes(i) ? "✅" : "";
    d.onclick = () => {
      const k = picked.indexOf(i);
      if (k >= 0) picked.splice(k, 1); else if (picked.length < MAX_SQUAD) picked.push(i); else return;
      haptic(); renderPick();
    };
    list.appendChild(d);
  });
  $("go").textContent = "✔ Готово (" + picked.length + ")";
}

// ─── карты (дизайн-координаты 360×430) ───
const DW = 360, DH = 430;
const SKIN = {normal:"👾",fast:"🏃",tank:"🛡",swarm:"🐜",dasher:"🐺",brute:"🦍",boss:"👹"};
const snake = [], zig = [];
for (let r = 0; r < 5; r++) for (let c = 0; c < 4; c++) snake.push([45 + (r % 2 === 0 ? c : 3 - c) * 90, 50 + r * 85]);
for (let c = 0; c < 4; c++) for (let r = 0; r < 5; r++) zig.push([45 + c * 90, 50 + (c % 2 === 0 ? r : 4 - r) * 85]);
const MAPS = [
